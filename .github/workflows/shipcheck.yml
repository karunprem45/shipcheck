name: shipcheck

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Python tests
        run: |
          pip install pytest
          cd agent && pytest -q --junitxml=../junit.xml
      - name: Go tests
        run: cd gate && go vet ./... && go test ./...
      - uses: actions/upload-artifact@v4
        with: { name: junit, path: junit.xml }

  readiness-gate:
    if: github.event_name == 'pull_request'
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: actions/download-artifact@v4
        with: { name: junit }
      - name: Security scan
        run: |
          pip install bandit anthropic
          bandit -r agent metrics -f json -o bandit.json --exit-zero
      - name: AI review of the diff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          cd agent && python -m shipcheck_agent.cli --diff ../pr.diff \
            --junit ../junit.xml --bandit ../bandit.json \
            --out ../evidence.json --md ../review.md
      - name: Release readiness gate
        id: gate
        run: |
          cd gate && go run . -evidence ../evidence.json -policy policy.json > ../gate.md
        continue-on-error: true
      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat gate.md review.md > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md --edit-last \
            || gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
      - name: Fail if not ready
        if: steps.gate.outcome == 'failure'
        run: exit 1
